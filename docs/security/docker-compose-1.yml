# How will volumes work?
  # Because the containers are tightly-coupled to the VM they are deployed on (meaning they cannot be deployed on another VM),
  # their volume can be hold locally on that VM. 

volumes:
  controller-1-volume:
  controller-2-volume:
  controller-3-volume:
  broker-1-volume:
  broker-2-volume:
  broker-3-volume:

services:
  controller-1:
    image: apache/kafka:4.0.0
    container_name: controller-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      # Mount location
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      # Consumer policies
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: on-failure:3
    volumes:
     - controller-1-volume:/var/lib/kafka/data

  controller-2:
    image: apache/kafka:4.0.0
    container_name: controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      # Mount location
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      # Consumer policies
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: on-failure:3
    volumes:
     - controller-2-volume:/var/lib/kafka/data

  controller-3:
    image: apache/kafka:4.0.0
    container_name: controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      # Mount location
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      # Consumer policies
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: on-failure:3
    volumes:
     - controller-3-volume:/var/lib/kafka/data

  broker-1:
    image: apache/kafka:4.0.0
    container_name: broker-1
    ports:
      - 29092:9092
    command: >
      /bin/bash 
      -c 
      'export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://:29092" && /etc/kafka/docker/run'
    environment:

      # Base configurations
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      # Mount location
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      # Consumer policies
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Retention policies
      KAFKA_LOG_RETENTION_MS: 86400000  # 1 day in milliseconds
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1 GB
      KAFKA_LOG_SEGMENT_BYTES: 524288000  # 500 MB
      KAFKA_LOG_CLEANUP_POLICY_DELETE_RETENTION_MS: 3600000  # 1 hour

      # Fault tolerance & High availability
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
     - broker-1-volume:/var/lib/kafka/data

  broker-2:
    image: apache/kafka:4.0.0
    container_name: broker-2
    ports:
      - 29093:9092
    command: >
      /bin/bash 
      -c 
      'export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://:29093" && /etc/kafka/docker/run'
    environment:

      # Base configurations
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      # Mount location
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      # Consumer policies
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Retention policies
      KAFKA_LOG_RETENTION_MS: 86400000  # 1 day in milliseconds
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1 GB
      KAFKA_LOG_SEGMENT_BYTES: 524288000  # 500 MB
      KAFKA_LOG_CLEANUP_POLICY_DELETE_RETENTION_MS: 3600000  # 1 hour

      # Fault tolerance & High availability
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
     - broker-2-volume:/var/lib/kafka/data

  broker-3:
    image: apache/kafka:4.0.0
    container_name: broker-3
    ports:
      - 39092:9092
    command: >
      /bin/bash 
      -c 
      'export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://:39092" && /etc/kafka/docker/run'
    environment:

      # Base configurations
      KAFKA_NODE_ID: 7
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093

      # Mount location
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      # Consumer policies
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Retention policies
      KAFKA_LOG_RETENTION_MS: 86400000  # 1 day in milliseconds
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1 GB
      KAFKA_LOG_SEGMENT_BYTES: 524288000  # 500 MB
      KAFKA_LOG_CLEANUP_POLICY_DELETE_RETENTION_MS: 3600000  # 1 hour

      # Fault tolerance & High availability
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

    restart: on-failure:3
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
     - broker-3-volume:/var/lib/kafka/data